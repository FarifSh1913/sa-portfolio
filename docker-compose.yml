services:
  app:
    build: .
    environment:
      AI_AGENT_API_URL: ${AI_AGENT_API_URL:-https://ai.lordfarif.ru}
      INTEGRA_BASE_URL: ${INTEGRA_BASE_URL:-https://integra-preprod.7tech.cloud}
    restart: unless-stopped
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
